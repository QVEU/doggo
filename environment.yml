# Pinned conda environment for doggo.
#
#   conda env create -f environment.yml      # or: mamba / micromamba
#   conda activate doggo
#   pip install --no-deps -e .               # installs the `doggo` command
#   doggo --help
#
# To freeze every transitive package for exact rebuilds:
#   conda-lock lock -f environment.yml -p linux-64 -p osx-64 -p osx-arm64 -p win-64
#   conda-lock install -n doggo conda-lock.yml
name: doggo
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12.7
  - numpy=2.1.3
  - pandas=2.2.3
  - scipy=1.14.1
  - statsmodels=0.14.4
  - pytest=8.3.3
  - pip=24.3.1
