[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "doggo"
dynamic = ["version"]
description = "Resampling-based gene set enrichment for arbitrary per-gene scores"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
doggo = "doggo.cli:main"
doggo-fetch = "doggo.msigdb:main"

[tool.setuptools.dynamic]
version = { attr = "doggo.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
